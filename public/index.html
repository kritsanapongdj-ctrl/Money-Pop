<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F6F0" />
    <meta
      name="description"
      content="Money-Pop - Family & Personal Expense Tracker (Neo-Brutalism Fintech Interface)"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Money-Pop | Family Expense Vault</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & IBM Plex Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '"IBM Plex Sans Thai"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              ink: '#12161A',
              paper: '#F5F6F0',
              paperDim: '#EAECE1',
              paperCard: '#FFFFFF',
              vaultBlue: '#2554FF',
              vaultEmerald: '#059669',
              vaultAmber: '#D97706',
              vaultCoral: '#E11D48',
              vaultPurple: '#7C3AED',
            },
            boxShadow: {
              'brutal-sm': '2px 2px 0px #12161A',
              'brutal': '3px 3px 0px #12161A',
              'brutal-lg': '5px 5px 0px #12161A',
              'brutal-xl': '8px 8px 0px #12161A',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#F5F6F0] text-[#12161A] antialiased selection:bg-[#2554FF] selection:text-white">
